<html lang="en">
<head>

     so link previews resolve correctly in email clients and the Common App. -->

<link rel="preload" as="image" href="images/hero.webp" fetchpriority="high">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --paper:      #F1F2F4;
  --paper-deep: #E6E8EB;
  --graphite-1: #14171B;
  --graphite-2: #4A5058;
  --graphite-3: #8A9099;
  --ink:        #0C0F13;
  --ink-text:   #DDE2E8;
  /* state-driven theme vars — flipped on body.inverted */
  --bg:        var(--paper);
  --fg:        var(--graphite-1);
  --fg-muted:  var(--graphite-2);
  --fg-faint:  var(--graphite-3);
  --hairline:  rgba(138,144,153,0.4);
  --matte:     var(--paper-deep);
  --font-display: 'Archivo', sans-serif;
  --font-body:    'Newsreader', serif;
  --font-label:   'IBM Plex Mono', monospace;
  --content-max: 1240px;
  --pad: 40px;
  --section-space: 140px;
  --fs-display-xl: 72px;
  --fs-display-lg: 38px;
  --fs-body: 19px;
  --fs-label: 12px;
}
body.inverted{
  --bg:       var(--ink);
  --fg:       var(--ink-text);
  --fg-muted: #A9B0BA;
  --fg-faint: #6B7178;
  --hairline: rgba(221,226,232,0.35);
  --matte:    #171B21;
}
@media (max-width: 600px){
  :root{
    --pad: 20px;
    --section-space: 80px;
    --fs-display-xl: 40px;
    --fs-display-lg: 27px;
    --fs-body: 17px;
    --fs-label: 11px;
  }
}
/* ============================================================
   RESET / BASE
   ============================================================ */
*, *::before, *::after{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior: auto; }
}
body{
  margin: 0;
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: 1.5;
  transition: background-color .7s ease, color .7s ease;
}
html.reduced-motion body{ transition: none; }
img{ max-width: 100%; display: block; }
a{ color: inherit; text-decoration: none; }
hr.hairline{
  border: none;
  border-top: 1px solid var(--hairline);
  margin: 14px 0;
  width: 100%;
}
:focus-visible{
  outline: 2px solid var(--fg);
  outline-offset: 3px;
}
.wrap{
  max-width: var(--content-max);
  margin-inline: auto;
  padding-inline: var(--pad);
}
.fill-blank{
  color: var(--fg-faint);
  border-bottom: 1px dashed var(--fg-faint);
  padding-bottom: 1px;
}
/* section label eyebrow, e.g. "STATEMENT" / "ABOUT / CONTACT" */
.section-label{
  font-family: var(--font-label);
  font-size: var(--fs-label);
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--fg-muted);
  margin: 0;
}
/* ============================================================
   NAV
   ============================================================ */
.site-nav{
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-inline: var(--pad);
  z-index: 60;
  color: var(--fg);
  transition: color .7s ease;
}
html.reduced-motion .site-nav{ transition: none; }
.nav-name{
  font-family: var(--font-display);
  font-weight: 600;
  font-stretch: 115%;
  letter-spacing: -0.02em;
  font-size: 15px;
  text-transform: uppercase;
}
.nav-links{
  font-family: var(--font-label);
  font-size: var(--fs-label);
  letter-spacing: 0.09em;
  text-transform: uppercase;
  display: flex;
  gap: 8px;
}
.nav-links a{ padding: 4px 2px; }
.nav-links a:hover{ text-decoration: underline; text-underline-offset: 4px; }
.nav-links span{ color: var(--fg-faint); }
/* ============================================================
   HERO
   ============================================================ */
.hero{
  position: relative;
  height: 100vh;
  min-height: 560px;
  overflow: hidden;
}
.hero-img{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
/* Functional legibility scrim, not decoration — single-hue fade in var(--paper) only,
   per Section 5 of the spec. Never used elsewhere on the page. */
.hero-scrim{
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 48%;
  background: linear-gradient(to top, rgba(241,242,244,0.62), rgba(241,242,244,0));
  pointer-events: none;
}
.hero-content{
  position: absolute;
  left: var(--pad);
  bottom: 64px;
  z-index: 2;
  max-width: 90%;
}
.hero-content h1{
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-stretch: 115%;
  letter-spacing: -0.02em;
  text-transform: uppercase;
  line-height: 1.02;
  font-size: var(--fs-display-xl);
  color: var(--graphite-1);
}
.hero-content p{
  margin: 12px 0 0;
  font-family: var(--font-label);
  font-size: var(--fs-label);
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--graphite-2);
}
.hero-scroll{
  position: absolute;
  right: var(--pad);
  bottom: 40px;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  font-family: var(--font-label);
  font-size: var(--fs-label);
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--graphite-2);
}
.hero-scroll::after{
  content: "";
  width: 1px;
  height: 28px;
  background: var(--graphite-3);
}
@media (max-width: 600px){
  .hero-content{ max-width: 100%; }
}
/* ============================================================
   STATEMENT
   ============================================================ */
.statement{
  padding-top: var(--section-space);
}
.statement-inner{
  max-width: 62ch;
}
.statement-placeholder{
  margin-top: 28px;
  padding: 24px;
  border: 1px dashed var(--fg-faint);
  color: var(--fg-faint);
  font-family: var(--font-body);
  font-style: italic;
  font-size: var(--fs-body);
  line-height: 1.65;
}
/* ============================================================
   PLATES — shared components
   ============================================================ */
.plate-block{
  padding-block: var(--section-space);
}
.plate-figure{
  display: block;
}
.plate-figure img{ width: 100%; height: auto; }
.wall-label{
  font-family: var(--font-label);
}
.wl-number{
  margin: 0;
  font-size: var(--fs-label);
  letter-spacing: 0.09em;
  color: var(--fg-muted);
}
.wl-title{
  margin: 0 0 10px;
  font-family: var(--font-display);
  font-weight: 600;
  font-stretch: 115%;
  letter-spacing: -0.02em;
  font-size: var(--fs-display-lg);
  line-height: 1.1;
  color: var(--fg);
}
.wl-meta{
  margin: 0;
  font-size: var(--fs-label);
  letter-spacing: 0.09em;
  text-transform: uppercase;
  line-height: 1.9;
  color: var(--fg-muted);
}
.wl-note{
  margin: 16px 0 0;
  font-family: var(--font-body);
  font-style: italic;
  font-size: 16px;
  line-height: 1.5;
  color: var(--fg-muted);
  max-width: 34ch;
}
/* two-up rows (Plate 01 / 02) */
.plate-row{
  display: grid;
  grid-template-columns: var(--img-w, 88%) 1fr;
  gap: 48px;
  align-items: start;
}
.plate-row--figure-left{
  grid-template-columns: var(--img-w, 88%) 1fr;
}
.plate-row--figure-right{
  grid-template-columns: 1fr var(--img-w, 88%);
}
.plate-row--figure-right .plate-figure{ order: 2; }
.plate-row--figure-right .wall-label{ order: 1; }
.plate-block--01{ --img-w: 92%; }
.plate-block--02{ --img-w: 88%; }
.plate-block--07 .plate-row{ --img-w: 34%; }
@media (max-width: 900px){
  .plate-row{ grid-template-columns: 1fr !important; }
  .plate-row--figure-right .plate-figure,
  .plate-row--figure-right .wall-label{ order: unset; }
  .wall-label{ margin-top: 20px; }
}
/* Plate 03 / 04 — the inversion pair */
.plate-pair{
  padding-block: var(--section-space);
}
.pair-images{
  display: flex;
  gap: 4%;
}
.pair-images .plate-figure{ flex: 0 0 46%; }
@media
